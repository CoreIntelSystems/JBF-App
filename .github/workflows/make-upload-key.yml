name: Make Play upload key (one time)

# Creates a new upload signing key and prints the four secret values in this
# run's log, which only people with access to the repository can read. Copy
# them into the repository secrets, then delete this file. Run it once.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  key:
    runs-on: ubuntu-latest
    steps:
      - name: Create the key and show the values
        run: |
          set -e
          PW=$(openssl rand -hex 12)
          keytool -genkeypair -keystore upload.jks -storetype PKCS12 -alias jbf-upload \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PW" -keypass "$PW" \
            -dname "CN=June Borns Family, O=CoreIntel Systems, C=GH"
          echo "PLAY_KEY_ALIAS = jbf-upload"
          echo "PLAY_KEYSTORE_PASSWORD and PLAY_KEY_PASSWORD (same value) = $PW"
          echo "PLAY_KEYSTORE_BASE64 = (everything on the next line)"
          base64 -w0 upload.jks
          echo
