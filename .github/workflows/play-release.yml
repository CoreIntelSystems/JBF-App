name: Play release bundle

# Builds the signed .aab to upload in Google Play Console. Run it by hand from
# the Actions tab. Needs these repository secrets: PLAY_KEYSTORE_BASE64,
# PLAY_KEYSTORE_PASSWORD, PLAY_KEY_ALIAS, PLAY_KEY_PASSWORD.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7

      - name: Decode the upload key
        env:
          PLAY_KEYSTORE_BASE64: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
        run: |
          test -n "$PLAY_KEYSTORE_BASE64" || { echo "PLAY_KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$PLAY_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build the bundle
        env:
          PLAY_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          PLAY_KEYSTORE_PASSWORD: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: jbf-play-bundle
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
