<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>June Borns Family</title>
<meta name="description" content="June Borns Family members: your dues, receipts, events, chats and ID card.">
<meta name="theme-color" content="#0b6b3a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JBF">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  @font-face { font-family: Inter; font-weight: 400 500; font-display: swap; src: url(Inter-Regular.woff2) format("woff2"); }
  @font-face { font-family: Inter; font-weight: 600 800; font-display: swap; src: url(Inter-SemiBold.woff2) format("woff2"); }
  :root {
    --green: #0b6e3b; --green-dark: #064d29; --gold: #c9a227; --tint: #eef3ee;
    --bg: #f3f5f2; --card: #ffffff; --text: #131c17; --muted: #5b685f;
    --line: #e2e7e1; --danger: #c53030; --ok: #1b8a4b; --gold-tint: #f6efd5;
    --shadow: 0 1px 2px rgba(19,28,23,.04), 0 4px 14px rgba(19,28,23,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c120e; --card: #151d18; --text: #e9eee9; --muted: #9faea4;
      --line: #26332b; --danger: #f2a7a3; --ok: #7fd3a1; --tint: #1b2a21;
      --gold-tint: #2d2a14; --green: #3fae72; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    padding-bottom: calc(84px + env(safe-area-inset-bottom));
  }
  header {
    background: linear-gradient(145deg, #0b6e3b, #064d29); color: #fff;
    padding: calc(22px + env(safe-area-inset-top)) 20px 26px;
    display: flex; align-items: center; gap: 14px;
    border-radius: 0 0 28px 28px;
  }
  header img { width: 52px; height: 52px; border-radius: 14px; background: #fff; }
  header h1 { margin: 0; font-size: 1.15rem; font-weight: 700; letter-spacing: -.01em; }
  header h1::before { content: "MEMBERS"; display: block; color: var(--gold); font-size: .65rem; letter-spacing: .14em; font-weight: 700; }
  main { max-width: 620px; margin: 0 auto; padding: 18px 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px; margin-bottom: 14px; box-shadow: var(--shadow); }
  h2 { margin: 0 0 10px; font-size: .78rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  label { display: block; font-weight: 600; font-size: .88rem; margin: 14px 0 6px; }
  input, select, textarea {
    width: 100%; font: inherit; padding: 13px 14px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--card); color: var(--text);
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus, select:focus, textarea:focus { outline: 0; border-color: var(--green); box-shadow: 0 0 0 3px rgba(11,110,59,.16); }
  button {
    font: inherit; font-weight: 600; width: 100%; margin-top: 18px; padding: 14px;
    border: 0; border-radius: 12px; background: var(--green); color: #fff; cursor: pointer;
    transition: transform .08s, opacity .15s;
  }
  button:active { transform: scale(.98); }
  button:disabled { opacity: .55; }
  button.link { background: none; color: var(--green); width: auto; padding: 8px 0; margin-top: 8px; }
  button.secondary { background: none; color: var(--green); border: 1px solid var(--green); }
  button.small { width: auto; margin: 0; padding: 8px 14px; font-size: .88rem; border-radius: 10px; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: .95rem; }
  .row:first-of-type { border-top: 0; }
  .row span:first-child { color: var(--muted); }
  .row span:last-child { text-align: right; font-weight: 600; }
  .big { font-size: 2rem; font-weight: 700; letter-spacing: -.03em; }
  .owed { color: var(--danger); } .clear { color: var(--ok); }
  .cand { display: flex; gap: 12px; align-items: center; padding: 10px; margin: 8px 0; border: 2px solid var(--line); border-radius: 14px; cursor: pointer; }
  .cand.picked { border-color: var(--green); background: rgba(27,138,75,.08); }
  .cphoto { border-radius: 18px; object-fit: cover; flex: none; }
  .cphoto.init { display: flex; align-items: center; justify-content: center; background: rgba(27,138,75,.14); color: var(--green); font-weight: 700; }
  .bar { height: 8px; border-radius: 99px; background: var(--line); margin-top: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--green); }
  .hint { color: var(--muted); font-size: .88rem; margin: 6px 0; }
  .error { color: var(--danger); font-weight: 600; font-size: .92rem; }
  .notice { background: var(--gold-tint); border: 1px solid rgba(201,162,39,.35); border-radius: 16px; padding: 14px 16px; margin-bottom: 14px; font-size: .94rem; }
  .pay .top { display: flex; justify-content: space-between; font-weight: 600; }
  .pay { padding: 12px 0; border-top: 1px solid var(--line); }
  .pay:first-of-type { border-top: 0; }
  .sub { color: var(--muted); font-size: .85rem; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { font-size: .74rem; font-weight: 600; border-radius: 999px; padding: 4px 11px; background: var(--tint); color: var(--green); }
  .chip.lead { background: var(--green); color: #fff; }
  .idcard { border-radius: 20px; overflow: hidden; border: 1px solid var(--line); background: var(--card); box-shadow: var(--shadow); margin-bottom: 14px; }
  .idcard .top { background: linear-gradient(145deg, #0b6e3b, #064d29); color: #fff; padding: 14px 16px; display: flex; gap: 12px; align-items: center; border-bottom: 3px solid var(--gold); font-weight: 600; }
  .idcard .top img { width: 40px; height: 40px; border-radius: 10px; background: #fff; }
  .idcard .top small { display: block; color: var(--gold); letter-spacing: .14em; font-size: .62rem; font-weight: 700; }
  .idcard .body { padding: 16px; }
  .idcard .no { color: var(--green); font-weight: 800; font-size: 1.35rem; letter-spacing: .04em; }
  nav {
    position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: var(--card);
    border-top: 1px solid var(--line); padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
  }
  nav button {
    flex: 1; margin: 0 2px; border-radius: 14px; background: none; color: var(--muted);
    font-size: .7rem; font-weight: 600; padding: 8px 2px;
  }
  nav button.on { color: var(--green); background: var(--tint); }
  nav button b { display: block; font-size: 1.3rem; font-weight: 400; line-height: 1.2; }
  .msgs { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .msg { max-width: 85%; padding: 9px 13px; border-radius: 16px 16px 16px 4px; background: var(--card); border: 1px solid var(--line); }
  .msg.mine { align-self: flex-end; background: var(--green); color: #fff; border-color: var(--green); border-radius: 16px 16px 4px 16px; }
  .msg.mine b { color: rgba(255,255,255,.8); }
  .msg b { display: block; font-size: .74rem; color: var(--muted); }
  .msgs.wa { background: #ece5dd; padding: 10px; border-radius: 14px; gap: 2px; }
  .wa-row { display: flex; align-items: flex-end; gap: 6px; }
  .wa-row.mine { justify-content: flex-end; }
  .wa-row.first { margin-top: 8px; }
  .wa-av { width: 34px; height: 34px; border-radius: 50%; flex: none; object-fit: cover; }
  .wa-av.init { display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.08); font-weight: 600; font-size: .8rem; }
  .wa-av.gap { background: none; }
  .msgs.wa .msg { position: relative; max-width: 78%; color: #111; background: #fff; border: 0; border-radius: 12px 12px 12px 3px; box-shadow: 0 1px 1px rgba(0,0,0,.15); padding: 6px 10px 4px; overflow-wrap: anywhere; }
  .msgs.wa .msg.mine { background: #dcf8c6; color: #111; border-radius: 12px 12px 3px 12px; }
  .msgs.wa .msg b { font-size: .8rem; font-weight: 600; }
  .msgs.wa .msg small { display: block; font-size: .68rem; color: #667; }
  .msgs.wa .msg .time { text-align: right; font-size: .62rem; }
  .msgs.wa .msg.sticker-msg { background: none; box-shadow: none; }
  .stickers[hidden], .replybar[hidden] { display: none; }
  .sticker { font-size: 3.6rem; line-height: 1.1; }
  .quote { border-left: 4px solid var(--green); background: rgba(0,0,0,.06); border-radius: 6px; padding: 3px 8px; margin: 3px 0 5px; font-size: .82rem; }
  .quote b { display: block; font-size: .74rem !important; }
  .quote span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 60vw; }
  .wa-img { display: block; max-width: 240px; width: 100%; border-radius: 8px; min-height: 60px; }
  .wa-file { display: flex; align-items: center; gap: 8px; width: auto; margin: 2px 0; background: rgba(0,0,0,.06); color: #111; text-align: left; }
  .wa-file small { display: block; }
  .meta { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .msgs.wa .msg .meta .time { margin-left: auto; }
  button.rep { width: auto; margin: 0; padding: 2px 0; background: none; color: #667; font-size: .72rem; }
  .chatbar { display: flex; gap: 18px; align-items: center; margin-bottom: 8px; }
  .chatbar button.link { margin: 0; padding: 4px 0; }
  .replybar { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; margin: 8px 0; }
  .replybar .quote { flex: 1; margin: 0; }
  .stickers { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px; margin: 8px 0; }
  .stickers button { background: none; font-size: 1.6rem; margin: 0; padding: 2px; }
  .send .icon { background: none; font-size: 1.25rem; padding: 4px; color: var(--text); }
  .chan { display: block; width: 100%; text-align: left; background: var(--card); color: var(--text); border: 1px solid var(--line); margin: 0 0 10px; border-radius: 14px; }
  .send { display: flex; gap: 4px; align-items: center; }
  .send input { flex: 1; min-width: 0; } .send button { width: auto; margin: 0; }
  .send button[type=submit] { padding: 10px 14px; }
  .zone { display: flex; gap: 10px; align-items: center; padding: 10px 0; font-weight: 400; margin: 0; }
  .zone input { width: auto; }
  [hidden] { display: none !important; }
  footer { text-align: center; color: var(--muted); font-size: .78rem; padding: 8px 16px 24px; }
</style>
</head>
<body>
<header>
  <img src="logo.png" alt="">
  <h1 id="orgName">June Borns Family</h1>
</header>
<main id="app"></main>
<nav id="tabs" hidden></nav>
<footer>Powered by CoreIntel Systems</footer>
<script src="app.js"></script>
</body>
</html>
