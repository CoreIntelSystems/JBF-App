<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>June Borns Family</title>
<meta name="description" content="June Borns Family members: your dues, receipts, events, chats and ID card.">
<meta name="theme-color" content="#0b6b3a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="logo.png">

<meta name="mobile-web-app-capable" content="yes">

<style>
  @font-face { font-family: Inter; font-weight: 400 500; font-display: swap; src: url(Inter-Regular.woff2) format("woff2"); }
  @font-face { font-family: Inter; font-weight: 600 800; font-display: swap; src: url(Inter-SemiBold.woff2) format("woff2"); }
  :root {
    --green: #0b6e3b; --green-dark: #064d29; --gold: #c9a227; --tint: #eef3ee;
    --bg: #f3f5f2; --card: #ffffff; --text: #131c17; --muted: #5b685f;
    --line: #e2e7e1; --danger: #c53030; --ok: #1b8a4b; --gold-tint: #f6efd5;
    --shadow: 0 1px 2px rgba(19,28,23,.04), 0 4px 14px rgba(19,28,23,.04);
    --c-head: #0b6e3b; --c-wall: #efe9e1; --c-dot: rgba(11,110,59,.07); --c-in: #ffffff; --c-out: #d9f3c4; --c-in-text: #17201b;
    --c-lift: 0%; --c-soft: #6b776f; --c-chip: #f1ead0; --c-chip-text: #6a5410; --c-tick: #2a9d5c; --c-shadow: 0 1px 1.5px rgba(19,28,23,.16);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c120e; --card: #151d18; --text: #e9eee9; --muted: #9faea4;
      --line: #26332b; --danger: #f2a7a3; --ok: #7fd3a1; --tint: #1b2a21;
      --gold-tint: #2d2a14; --green: #3fae72; --shadow: none;
      --c-head: #12301f; --c-wall: #121a15; --c-dot: rgba(63,174,114,.08); --c-in: #212b25; --c-out: #1d5a39; --c-in-text: #eef2ee;
      --c-lift: 55%; --c-soft: #a3b0a7; --c-chip: #2d2a14; --c-chip-text: #e3c76a; --c-tick: #7fd3a1; --c-shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    padding-bottom: calc(84px + env(safe-area-inset-bottom));
  }
  header {
    background: linear-gradient(145deg, #0b6e3b, #064d29); color: #fff;
    padding: calc(22px + env(safe-area-inset-top)) 20px 26px;
    display: flex; align-items: center; gap: 14px;
    border-radius: 0 0 28px 28px;
  }
  header img { width: 52px; height: 52px; border-radius: 14px; background: #fff; }
  header h1 { margin: 0; font-size: 1.15rem; font-weight: 700; letter-spacing: -.01em; }
  header h1::before { content: "MEMBERS"; display: block; color: var(--gold); font-size: .65rem; letter-spacing: .14em; font-weight: 700; }
  main { max-width: 620px; margin: 0 auto; padding: 18px 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px; margin-bottom: 14px; box-shadow: var(--shadow); }
  h2 { margin: 0 0 10px; font-size: .78rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  label { display: block; font-weight: 600; font-size: .88rem; margin: 14px 0 6px; }
  input, select, textarea {
    width: 100%; font: inherit; padding: 13px 14px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--card); color: var(--text);
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus, select:focus, textarea:focus { outline: 0; border-color: var(--green); box-shadow: 0 0 0 3px rgba(11,110,59,.16); }
  /* Forms: compact fields in titled groups */
  .form { padding: 6px 18px 18px; }
  .grp { padding: 14px 0 4px; border-top: 1px solid var(--line); }
  .grp:first-of-type { border-top: 0; padding-top: 10px; }
  .grp > h3 { margin: 0 0 2px; font-size: .72rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--green); }
  .fld label { margin: 10px 0 4px; font-size: .78rem; font-weight: 600; color: var(--muted); }
  .fld input, .fld select { padding: 10px 12px; border-radius: 10px; font-size: .95rem; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  @media (max-width: 340px) { .pair { grid-template-columns: 1fr; } }
  .form button[type=submit] { margin-top: 20px; padding: 13px; }
  details.fold { padding: 0; }
  details.fold > summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; font-weight: 600; font-size: .95rem; }
  details.fold > summary::-webkit-details-marker { display: none; }
  details.fold > summary::after { content: ""; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); transition: transform .15s; }
  details.fold[open] > summary::after { transform: rotate(-135deg); }
  details.fold > .inner { padding: 0 18px 18px; border-top: 1px solid var(--line); }
  button.out { background: none; color: var(--muted); border: 1px solid var(--line); margin: 6px 0 14px; }
  button {
    font: inherit; font-weight: 600; width: 100%; margin-top: 18px; padding: 14px;
    border: 0; border-radius: 12px; background: var(--green); color: #fff; cursor: pointer;
    transition: transform .08s, opacity .15s;
  }
  button:active { transform: scale(.98); }
  button:disabled { opacity: .55; }
  button.link { background: none; color: var(--green); width: auto; padding: 8px 0; margin-top: 8px; }
  button.secondary { background: none; color: var(--green); border: 1px solid var(--green); }
  button.small { width: auto; margin: 0; padding: 8px 14px; font-size: .88rem; border-radius: 10px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: .95rem; }
  .row:first-of-type { border-top: 0; }
  .row span:first-child { color: var(--muted); }
  .row span:last-child { text-align: right; font-weight: 600; }
  .big { font-size: 2rem; font-weight: 700; letter-spacing: -.03em; }
  .owed { color: var(--danger); } .clear { color: var(--ok); }
  .cand { display: flex; gap: 12px; align-items: center; padding: 10px; margin: 8px 0; border: 2px solid var(--line); border-radius: 14px; cursor: pointer; }
  .cand.picked { border-color: var(--green); background: rgba(27,138,75,.08); }
  .cphoto { border-radius: 18px; object-fit: cover; flex: none; }
  .cphoto.init { display: flex; align-items: center; justify-content: center; background: rgba(27,138,75,.14); color: var(--green); font-weight: 700; }
  .bar { height: 8px; border-radius: 99px; background: var(--line); margin-top: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--green); }
  .notice a, .note a { color: var(--green); font-weight: 600; }
  .hint { color: var(--muted); font-size: .88rem; margin: 6px 0; }
  .error { color: var(--danger); font-weight: 600; font-size: .92rem; }
  .notice { background: var(--gold-tint); border: 1px solid rgba(201,162,39,.35); border-radius: 16px; padding: 14px 16px; margin-bottom: 14px; font-size: .94rem; }
  .pay .top { display: flex; justify-content: space-between; font-weight: 600; }
  .pay { padding: 12px 0; border-top: 1px solid var(--line); }
  .pay:first-of-type { border-top: 0; }
  .sub { color: var(--muted); font-size: .85rem; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { font-size: .74rem; font-weight: 600; border-radius: 999px; padding: 4px 11px; background: var(--tint); color: var(--green); }
  .chip.lead { background: var(--green); color: #fff; }
  .idcard { border-radius: 20px; overflow: hidden; border: 1px solid var(--line); background: var(--card); box-shadow: 0 10px 26px rgba(6,40,22,.18); margin-bottom: 14px; }
  .idcard .top { background: repeating-linear-gradient(115deg, rgba(255,255,255,.045) 0 2px, transparent 2px 9px), linear-gradient(145deg, #0f7a43, #064d29); color: #fff; padding: 14px 16px; display: flex; gap: 12px; align-items: center; border-bottom: 3px solid var(--gold); font-weight: 600; }
  .idcard .top img { width: 40px; height: 40px; border-radius: 10px; background: #fff; }
  .idcard .top small { display: block; color: #e5c766; letter-spacing: .14em; font-size: .62rem; font-weight: 700; }
  .idcard .top .st { margin-left: auto; font-size: .62rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #bff0d3; border: 1px solid rgba(191,240,211,.45); border-radius: 99px; padding: 3px 8px; flex: none; }
  .idcard .body { padding: 16px 16px 12px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; }
  .idcard .body .chips { grid-column: 1 / -1; }
  .idcard .nm { font-weight: 700; font-size: 1.08rem; letter-spacing: -.01em; }
  .idcard .ph { width: 64px; height: 76px; border-radius: 10px; border: 2px solid var(--gold); background: linear-gradient(150deg, #d8b94a, #0b6e3b); display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 1.15rem; overflow: hidden; }
  .idcard .ph img { width: 100%; height: 100%; object-fit: cover; }
  .idcard .ft { display: flex; justify-content: space-between; gap: 8px; padding: 9px 16px; background: var(--tint); font-size: .64rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .dues .row2 { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .cap { font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .pill { font-size: .72rem; font-weight: 600; padding: 3px 10px; border-radius: 99px; background: rgba(27,138,75,.14); color: var(--ok); }
  .pill.w { background: var(--gold-tint); color: #8a5a05; }
  .dues .big { font-size: 1.7rem; margin: 8px 0 2px; font-variant-numeric: tabular-nums; }
  .dues .bar { height: 6px; margin: 12px 0 8px; }
  .two { display: flex; justify-content: space-between; font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .two b { color: var(--text); font-weight: 600; }
  .acts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
  button.act { background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 14px; padding: 12px 2px 10px; font-size: .72rem; font-weight: 600; box-shadow: var(--shadow); display: block; width: auto; margin: 0; }
  button.act svg { display: block; margin: 0 auto 5px; color: var(--green); }
  .card.notes { padding: 14px 18px 4px; }
  .note { display: flex; gap: 10px; align-items: flex-start; padding: 11px 0; border-top: 1px solid var(--line); font-size: .92rem; }
  .note:first-of-type { border-top: 0; }
  .note .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); margin-top: 8px; flex: none; }
  .idcard .no { color: var(--green); font-weight: 800; font-size: 1.35rem; letter-spacing: .04em; }
  nav {
    position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: var(--card);
    border-top: 1px solid var(--line); padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
  }
  nav button {
    flex: 1; margin: 0 2px; border-radius: 14px; background: none; color: var(--muted);
    font-size: .7rem; font-weight: 600; padding: 8px 2px;
  }
  nav button.on { color: var(--green); background: var(--tint); }
  nav button b { display: grid; place-items: center; height: 24px; margin-bottom: 2px; }
  /* chats */
  .c-head { background: var(--c-head); color: #fff; display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 18px 18px 0 0; }
  .c-head .back { background: none; border: 0; padding: 4px; margin: 0; width: auto; display: flex; color: #fff; }
  .c-crest { width: 38px; height: 38px; border-radius: 50%; background: var(--gold); color: #3a2f06; display: grid; place-items: center; font-weight: 800; font-size: .78rem; flex: none; }
  .c-head .t { min-width: 0; line-height: 1.2; }
  .c-head .t b { display: block; font-size: 1rem; font-weight: 650; }
  .c-head .t span { font-size: .75rem; opacity: .8; }
  .c-head .me { margin: 0 0 0 auto; background: rgba(255,255,255,.14); border-radius: 50%; width: 36px; height: 36px; padding: 0; display: grid; place-items: center; color: #fff; }
  .c-msgs { background-color: var(--c-wall); background-image: radial-gradient(var(--c-dot) 1.2px, transparent 1.4px); background-size: 16px 16px; padding: 10px 10px 14px; display: flex; flex-direction: column; gap: 3px; min-height: 40vh; }
  .c-day { align-self: center; margin: 6px 0 4px; background: var(--card); color: var(--muted); font-size: .7rem; font-weight: 600; padding: 4px 12px; border-radius: 999px; box-shadow: var(--c-shadow); }
  .c-r { display: flex; align-items: flex-end; gap: 7px; }
  .c-r.mine { justify-content: flex-end; }
  .c-r.first { margin-top: 9px; }
  .c-av { width: 32px; height: 32px; border-radius: 50%; flex: none; object-fit: cover; display: grid; place-items: center; font-size: .74rem; font-weight: 700; background: color-mix(in srgb, var(--c, #888) 20%, var(--card)); color: color-mix(in srgb, var(--c, var(--text)), white var(--c-lift)); }
  .c-av.gap { background: none; }
  .c-b { position: relative; max-width: 80%; min-width: 0; background: var(--c-in); color: var(--c-in-text); border-radius: 12px; padding: 6px 10px 5px; box-shadow: var(--c-shadow); overflow-wrap: anywhere; font-size: .94rem; line-height: 1.4; }
  .c-r.first:not(.mine) .c-b { border-top-left-radius: 3px; }
  .c-r.mine .c-b { background: var(--c-out); }
  .c-r.mine.first .c-b { border-top-right-radius: 3px; }
  .c-who { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 7px; margin-bottom: 2px; }
  .c-who b { font-size: .8rem; font-weight: 650; color: color-mix(in srgb, var(--c), white var(--c-lift)); }
  .c-who i { font-size: .7rem; color: var(--c-soft); }
  .c-zone { font-size: .62rem; font-weight: 650; background: var(--c-chip); color: var(--c-chip-text); padding: 1px 7px; border-radius: 999px; }
  .c-foot { display: flex; align-items: center; justify-content: flex-end; gap: 6px; margin-top: 1px; font-size: .64rem; color: var(--c-soft); font-variant-numeric: tabular-nums; }
  .c-foot .rep { margin: 0 auto 0 0; width: auto; background: none; border: 0; padding: 2px 4px 2px 0; display: flex; align-items: center; gap: 3px; color: var(--c-soft); font-size: .68rem; font-weight: 500; }
  .c-foot .tick { color: var(--c-tick); }
  .c-q { border-left: 3px solid var(--c, var(--green)); background: color-mix(in srgb, var(--c, var(--green)) 10%, transparent); border-radius: 6px; padding: 4px 8px; margin: 2px 0 5px; font-size: .8rem; }
  .c-q b { display: block; font-size: .72rem; color: color-mix(in srgb, var(--c, var(--green)), white var(--c-lift)); }
  .c-q span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--c-soft); }
  .c-img { display: block; width: 100%; max-width: 240px; min-height: 60px; border-radius: 9px; margin: 1px 0 3px; }
  .c-file { display: flex; align-items: center; gap: 10px; width: 100%; min-width: 210px; margin: 1px 0 3px; padding: 8px 10px; border: 0; border-radius: 9px; background: color-mix(in srgb, var(--c-soft) 13%, transparent); color: inherit; text-align: left; font-weight: 400; }
  .c-file .ic { width: 38px; height: 44px; border-radius: 6px; background: #d64545; color: #fff; display: grid; place-items: center; font-size: .6rem; font-weight: 800; flex: none; }
  .c-file .nm { min-width: 0; line-height: 1.25; }
  .c-file .nm b { display: block; font-size: .85rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .c-file .nm span { font-size: .7rem; color: var(--c-soft); }
  .c-file .dl { margin-left: auto; width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--c-soft); display: grid; place-items: center; color: var(--c-soft); flex: none; }
  .c-stk { font-size: 3.5rem; line-height: 1.1; padding: 0 4px; }
  .c-stkrow .c-foot { justify-content: flex-start; padding-left: 6px; }
  .c-composer { background: var(--bg); border: 1px solid var(--line); border-top: 0; border-radius: 0 0 18px 18px; padding: 8px 10px 12px; }
  .c-replybar { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 6px 6px 6px 8px; margin-bottom: 8px; }
  .c-replybar .c-q { flex: 1; margin: 0; min-width: 0; }
  .c-replybar .x { margin: 0; width: auto; background: none; border: 0; padding: 6px; display: flex; color: var(--c-soft); }
  .c-tray { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px; margin-bottom: 8px; }
  .c-tray h3 { margin: 0 0 6px 4px; font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .c-tray .g { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; }
  .c-tray .g button { margin: 0; width: auto; background: none; border: 0; font-size: 1.55rem; padding: 5px 0; border-radius: 10px; }
  .c-bar { display: flex; align-items: flex-end; gap: 8px; }
  .c-field { flex: 1; min-width: 0; display: flex; align-items: center; gap: 2px; background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 3px 6px; }
  .c-field input { flex: 1; min-width: 0; border: 0; background: none; color: var(--text); font: inherit; font-size: .95rem; padding: 9px 4px; box-shadow: none; }
  .c-field:focus-within { border-color: var(--green); box-shadow: 0 0 0 3px rgba(11,110,59,.16); }
  .c-ib { margin: 0; background: none; border: 0; width: 36px; height: 36px; padding: 0; display: grid; place-items: center; color: var(--c-soft); border-radius: 50%; flex: none; }
  .c-go { margin: 0; width: 44px; height: 44px; padding: 0; border-radius: 50%; border: 0; background: var(--green); color: #fff; display: grid; place-items: center; flex: none; }
  .c-pic { display: flex; align-items: center; gap: 14px; }
  .c-pic .big { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; display: grid; place-items: center; font-weight: 700; font-size: 1.1rem; color: #fff; background: linear-gradient(140deg, #d8b94a, #0b6e3b); box-shadow: 0 0 0 3px var(--card), 0 0 0 5px var(--gold); flex: none; }
  .c-pic > div { display: grid; gap: 2px; }
  .c-nm { font-size: 1.1rem; letter-spacing: -.01em; }
  .c-acts { display: flex; gap: 8px; margin-top: 14px; }
  button.secondary.small { background: var(--tint); color: var(--green); }
  .c-pic span { color: var(--muted); font-size: .88rem; line-height: 1.4; }
  .chan { display: block; width: 100%; text-align: left; background: var(--card); color: var(--text); border: 1px solid var(--line); margin: 0 0 10px; border-radius: 14px; }
  .zone { display: flex; gap: 10px; align-items: center; padding: 10px 0; font-weight: 400; margin: 0; }
  .zone input { width: auto; }
  [hidden] { display: none !important; }
  footer { text-align: center; color: var(--muted); font-size: .78rem; padding: 8px 16px 24px; }
</style>
</head>
<body>
<header>
  <img src="logo.png" alt="">
  <h1 id="orgName">June Borns Family</h1>
</header>
<main id="app"></main>
<nav id="tabs" hidden></nav>
<footer>Powered by CoreIntel Systems</footer>
<script src="app.js?v=20"></script>
</body>
</html>
