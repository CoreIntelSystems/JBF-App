<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>June Borns Family</title>
<meta name="description" content="June Borns Family members: your dues, receipts, events, chats and ID card.">
<meta name="theme-color" content="#0b6b3a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JBF">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --green: #0b6b3a; --green-dark: #084d2a; --gold: #c9a227; --tint: #f3e9c6;
    --bg: #f6f4ee; --card: #ffffff; --text: #1d2621; --muted: #5c6a62;
    --line: #e4e0d4; --danger: #b3261e; --ok: #0b6b3a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101512; --card: #18201b; --text: #ecefe9; --muted: #a3b0a8;
      --line: #2a352e; --danger: #f2b8b5; --ok: #7fd3a1; --tint: #2d2a14;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.45;
    padding-bottom: calc(72px + env(safe-area-inset-bottom));
  }
  header {
    background: var(--green); color: #fff; text-align: center;
    padding: calc(16px + env(safe-area-inset-top)) 16px 18px;
    border-bottom: 4px solid var(--gold);
  }
  header img { width: 56px; height: 56px; border-radius: 10px; background: #fff; }
  header h1 { margin: 6px 0 0; font-size: 1.2rem; }
  main { max-width: 600px; margin: 0 auto; padding: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  h2 { margin: 0 0 8px; font-size: 1.05rem; }
  label { display: block; font-weight: 600; margin: 12px 0 4px; }
  input, select, textarea {
    width: 100%; font: inherit; padding: 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
  }
  button {
    font: inherit; font-weight: 600; width: 100%; margin-top: 16px; padding: 13px;
    border: 0; border-radius: 12px; background: var(--green); color: #fff; cursor: pointer;
  }
  button:disabled { opacity: .6; }
  button.link { background: none; color: var(--green); width: auto; padding: 8px 0; margin-top: 8px; }
  button.small { width: auto; margin: 0; padding: 8px 14px; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; }
  .row span:last-child { text-align: right; font-weight: 600; }
  .big { font-size: 1.7rem; font-weight: 700; }
  .owed { color: var(--danger); } .clear { color: var(--ok); }
  .hint { color: var(--muted); font-size: .9rem; margin: 4px 0; }
  .error { color: var(--danger); font-weight: 600; }
  .notice { background: var(--tint); border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; }
  .pay .top { display: flex; justify-content: space-between; font-weight: 600; }
  .pay { padding: 8px 0; border-top: 1px solid var(--line); }
  .pay:first-of-type { border-top: 0; }
  .sub { color: var(--muted); font-size: .88rem; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { font-size: .78rem; font-weight: 700; border-radius: 999px; padding: 3px 10px; background: var(--tint); color: var(--green); }
  .chip.lead { background: var(--green); color: #fff; }
  .idcard { border-radius: 16px; overflow: hidden; border: 1px solid var(--line); background: var(--card); }
  .idcard .top { background: var(--green); color: #fff; padding: 10px 14px; display: flex; gap: 10px; align-items: center; border-bottom: 3px solid var(--gold); }
  .idcard .top img { width: 36px; height: 36px; border-radius: 6px; background: #fff; }
  .idcard .top small { display: block; color: var(--gold); letter-spacing: .12em; font-size: .62rem; }
  .idcard .body { padding: 14px; }
  .idcard .no { color: var(--green); font-weight: 800; font-size: 1.3rem; letter-spacing: .05em; }
  nav {
    position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: var(--card);
    border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom);
  }
  nav button {
    flex: 1; margin: 0; border-radius: 0; background: none; color: var(--muted);
    font-size: .74rem; padding: 10px 2px;
  }
  nav button.on { color: var(--green); }
  nav button b { display: block; font-size: 1.25rem; font-weight: 400; }
  .msgs { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .msg { max-width: 85%; padding: 8px 12px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); }
  .msg.mine { align-self: flex-end; background: var(--tint); }
  .msg b { display: block; font-size: .78rem; color: var(--muted); }
  .chan { display: block; width: 100%; text-align: left; background: var(--card); color: var(--text); border: 1px solid var(--line); margin: 0 0 10px; }
  .send { display: flex; gap: 8px; }
  .send input { flex: 1; } .send button { width: auto; margin: 0; }
  .zone { display: flex; gap: 10px; align-items: center; padding: 8px 0; font-weight: 400; margin: 0; }
  .zone input { width: auto; }
  [hidden] { display: none !important; }
  footer { text-align: center; color: var(--muted); font-size: .8rem; padding: 8px 16px 24px; }
</style>
</head>
<body>
<header>
  <img src="logo.png" alt="">
  <h1 id="orgName">June Borns Family</h1>
</header>
<main id="app"></main>
<nav id="tabs" hidden></nav>
<footer>Powered by CoreIntel Systems</footer>
<script src="app.js"></script>
</body>
</html>
