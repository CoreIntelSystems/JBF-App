<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JBF Member Portal</title>
<meta name="description" content="June Borns Family members: check your dues and receipts.">
<link rel="icon" href="logo.png">
<style>
  :root {
    --green: #0b6b3a;
    --green-dark: #084d2a;
    --gold: #c9a227;
    --bg: #f6f4ee;
    --card: #ffffff;
    --text: #1d2621;
    --muted: #5c6a62;
    --line: #e4e0d4;
    --danger: #b3261e;
    --ok: #0b6b3a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101512;
      --card: #18201b;
      --text: #ecefe9;
      --muted: #a3b0a8;
      --line: #2a352e;
      --danger: #f2b8b5;
      --ok: #7fd3a1;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.45;
  }
  header {
    background: var(--green);
    color: #fff;
    padding: 20px 16px 24px;
    text-align: center;
    border-bottom: 4px solid var(--gold);
  }
  header img { width: 72px; height: 72px; border-radius: 12px; background: #fff; }
  header h1 { margin: 8px 0 2px; font-size: 1.35rem; }
  header p { margin: 0; opacity: .85; font-size: .95rem; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 16px;
  }
  label { display: block; font-weight: 600; margin: 12px 0 4px; }
  input {
    width: 100%;
    font-size: 1.05rem;
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--bg);
    color: var(--text);
  }
  input:focus { outline: 2px solid var(--gold); border-color: var(--gold); }
  button {
    width: 100%;
    margin-top: 16px;
    padding: 13px;
    font-size: 1.05rem;
    font-weight: 600;
    border: 0;
    border-radius: 10px;
    background: var(--green);
    color: #fff;
    cursor: pointer;
  }
  button:disabled { opacity: .6; }
  button.link {
    background: none; color: var(--green); width: auto; padding: 8px 0;
    margin: 0; font-weight: 600;
  }
  @media (prefers-color-scheme: dark) { button.link { color: var(--gold); } }
  .hint { color: var(--muted); font-size: .9rem; }
  .error { color: var(--danger); font-weight: 600; margin-top: 12px; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; }
  .row span:first-child { color: var(--muted); }
  .big { font-size: 1.8rem; font-weight: 700; }
  .owed { color: var(--danger); }
  .clear { color: var(--ok); }
  h2 { font-size: 1.1rem; margin: 0 0 8px; }
  .pay { border-top: 1px solid var(--line); padding: 10px 0; }
  .pay:first-of-type { border-top: 0; }
  .pay .top { display: flex; justify-content: space-between; font-weight: 600; }
  .pay .sub { color: var(--muted); font-size: .9rem; }
  footer { text-align: center; color: var(--muted); font-size: .85rem; padding: 8px 16px 32px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <img src="logo.png" alt="JBF shield">
  <h1>June Borns Family</h1>
  <p>Member portal</p>
</header>
<main>
  <form id="login" class="card" autocomplete="on">
    <h2>Check your dues and receipts</h2>
    <p class="hint">Enter your member ID (on your ID card or receipts) and the
      phone number the association has for you.</p>
    <label for="memberNo">Member ID</label>
    <input id="memberNo" name="memberNo" placeholder="e.g. JBF-000123"
      autocapitalize="characters" autocomplete="username" required>
    <label for="phone">Phone number</label>
    <input id="phone" name="phone" type="tel" placeholder="e.g. 024 123 4567"
      autocomplete="tel" required>
    <button id="go" type="submit">View my statement</button>
    <p id="error" class="error" role="alert" hidden></p>
  </form>

  <section id="statement" hidden>
    <div class="card">
      <h2 id="name"></h2>
      <div class="row"><span>Member ID</span><span id="memberId"></span></div>
      <div class="row"><span>Zone</span><span id="zones"></span></div>
      <div class="row"><span>Member since</span><span id="joined"></span></div>
      <div class="row"><span>Status</span><span id="status"></span></div>
    </div>
    <div id="dues"></div>
    <div class="card">
      <h2>Payments</h2>
      <div id="payments"></div>
    </div>
    <p class="hint" id="updated"></p>
    <button class="link" id="signOut" type="button">Check another member</button>
  </section>
</main>
<footer>Powered by CoreIntel Systems. Questions about your record? Speak to your zone officers.</footer>

<script>
  const CLOUD = 'https://ucheilfvkovukzunkvrl.supabase.co';
  const KEY = 'sb_publishable__fqy0XUzs6MG7zkEEWigTQ_Ez15BGoL';
  const ORG = 'JBF';

  const $ = (id) => document.getElementById(id);
  const money = (pesewas) =>
    'GHS ' + (pesewas / 100).toLocaleString('en-GH', {
      minimumFractionDigits: 2, maximumFractionDigits: 2,
    });
  const monthName = (period) => {
    if (!period) return '';
    const [y, m] = period.split('-').map(Number);
    return new Date(y, m - 1, 1).toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
  };
  const day = (iso) => iso
    ? new Date(iso + 'T12:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })
    : '';
  const methods = { cash: 'Cash', momo: 'Mobile money', bank: 'Bank' };
  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  };

  function showError(msg) {
    $('error').textContent = msg;
    $('error').hidden = false;
  }

  async function load(memberNo, phone) {
    const res = await fetch(CLOUD + '/rest/v1/rpc/portal_statement', {
      method: 'POST',
      headers: { apikey: KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ org: ORG, member_no: memberNo, phone }),
    });
    const body = await res.json().catch(() => null);
    if (!res.ok) throw new Error(body && body.message ? body.message : 'The portal is not available right now. Please try again later.');
    if (body && body.error) throw new Error(body.error);
    return body;
  }

  function render(s) {
    const m = s.member;
    $('name').textContent = m.name;
    $('memberId').textContent = m.member_no;
    $('zones').textContent = m.zones.length ? m.zones.join(', ') : 'None';
    $('joined').textContent = day(m.joined);
    $('status').textContent = m.status.charAt(0).toUpperCase() + m.status.slice(1);

    const dues = $('dues');
    dues.replaceChildren();
    for (const d of s.dues) {
      const card = el('div', 'card');
      card.append(el('h2', null, d.name));
      if (d.outstanding > 0) {
        card.append(el('div', 'big owed', money(d.outstanding)));
        card.append(el('p', 'hint',
          `Owed: ${d.months_behind} month${d.months_behind === 1 ? '' : 's'} behind, from ${monthName(d.next_unpaid)}.`));
      } else {
        card.append(el('div', 'big clear', 'Up to date'));
        card.append(el('p', 'hint', 'Thank you for keeping your dues paid.'));
      }
      for (const [label, value] of [
        ['Monthly amount', money(d.monthly)],
        ['Months due so far', String(d.months)],
        ['Expected', money(d.expected)],
        ['Paid', money(d.paid)],
      ]) {
        const row = el('div', 'row');
        row.append(el('span', null, label), el('span', null, value));
        card.append(row);
      }
      dues.append(card);
    }

    const list = $('payments');
    list.replaceChildren();
    if (!s.payments.length) list.append(el('p', 'hint', 'No payments recorded yet.'));
    for (const p of s.payments) {
      const item = el('div', 'pay');
      const top = el('div', 'top');
      top.append(el('span', null, p.type || 'Payment'), el('span', null, money(p.amount)));
      item.append(top);
      item.append(el('div', 'sub',
        [day(p.paid_on), p.period ? 'for ' + monthName(p.period) : '', methods[p.method] || p.method, p.receipt_no]
          .filter(Boolean).join(' · ')));
      list.append(item);
    }
    $('updated').textContent = s.updated
      ? 'Records last updated ' + new Date(s.updated).toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' }) + '.'
      : '';
    $('login').hidden = true;
    $('statement').hidden = false;
    window.scrollTo(0, 0);
  }

  $('login').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('error').hidden = true;
    const memberNo = $('memberNo').value.trim();
    const phone = $('phone').value.trim();
    $('go').disabled = true;
    $('go').textContent = 'Checking...';
    try {
      render(await load(memberNo, phone));
    } catch (err) {
      showError(err.message || 'Something went wrong. Please try again.');
    } finally {
      $('go').disabled = false;
      $('go').textContent = 'View my statement';
    }
  });

  $('signOut').addEventListener('click', () => {
    $('statement').hidden = true;
    $('login').hidden = false;
    $('phone').value = '';
    $('memberNo').value = '';
    $('memberNo').focus();
  });
</script>
</body>
</html>
